<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08152a;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#08152a}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:5;color:#fff;font-weight:900;font-size:clamp(18px,4.5vw,30px);text-shadow:0 2px 4px #123;pointer-events:none}
#hud small{display:block;text-align:right;font-size:.48em;opacity:.9}
#controls{position:fixed;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));z-index:6;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.btn{pointer-events:auto;border:2px solid rgba(255,255,255,.8);background:rgba(0,0,0,.32);color:#fff;border-radius:22px;width:92px;height:68px;font-size:17px;font-weight:900;box-shadow:0 5px 18px #0005;backdrop-filter:blur(4px);touch-action:none}
.btn:active{transform:scale(.95);background:rgba(255,255,255,.28)}
#jump{border-color:#a9e8ff} #attack{border-color:#ffd27a}
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(#07152dcc,#07152d99);color:#fff;text-align:center}
.card{max-width:520px;width:min(92vw,520px);padding:26px 22px;border-radius:28px;background:#07162ee8;border:1px solid #ffffff38;box-shadow:0 20px 70px #0008}
h1{margin:0 0 8px;font-size:clamp(28px,8vw,52px)} .sub{opacity:.9;line-height:1.6}
#start,#again{position:relative;z-index:20;touch-action:manipulation;cursor:pointer;margin-top:18px;border:0;border-radius:18px;padding:14px 28px;font-size:20px;font-weight:900;background:#ffd34d;color:#3a2300;box-shadow:0 8px 24px #0005}
.hidden{display:none!important}
.badge{display:inline-block;margin-top:8px;padding:6px 12px;border-radius:999px;background:#ffffff16;font-size:13px}
</style>

<style>
  #jump, #attack {
    touch-action: none !important;
    -webkit-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none !important;
    pointer-events: auto !important;
    position: relative;
    z-index: 50 !important;
  }
</style>
<script>
(function(){
  function bindControls(){
    const jumpBtn = document.getElementById('jump');
    const attackBtn = document.getElementById('attack');

    if(!jumpBtn || !attackBtn){
      setTimeout(bindControls, 50);
      return;
    }

    function startIfNeeded(){
      if(typeof forceStartGame === 'function' && !running){
        forceStartGame();
      }
    }

    function doJump(e){
      if(e){ e.preventDefault(); e.stopPropagation(); }
      startIfNeeded();
      // Start first, then perform the jump on the same user action.
      if(typeof jump === 'function'){
        if(!running) return;
        jump();
      }
    }

    function doAttack(e){
      if(e){ e.preventDefault(); e.stopPropagation(); }
      startIfNeeded();
      if(typeof attack === 'function'){
        if(!running) return;
        attack();
      }
    }

    // Pointer events are the primary mobile input. They avoid the
    // pointerdown + touchstart double-fire that can consume both jumps.
    if(window.PointerEvent){
      jumpBtn.addEventListener('pointerdown', doJump, {passive:false});
      attackBtn.addEventListener('pointerdown', doAttack, {passive:false});
    }else{
      jumpBtn.addEventListener('touchstart', doJump, {passive:false});
      attackBtn.addEventListener('touchstart', doAttack, {passive:false});
    }

    jumpBtn.addEventListener('click', function(e){ e.preventDefault(); }, {passive:false});
    attackBtn.addEventListener('click', function(e){ e.preventDefault(); }, {passive:false});
    jumpBtn.addEventListener('contextmenu', e=>e.preventDefault());
    attackBtn.addEventListener('contextmenu', e=>e.preventDefault());

    window.addEventListener('keydown', function(e){
      if(e.code==='Space' || e.code==='ArrowUp') doJump(e);
      if(e.code==='KeyX' || e.code==='KeyZ') doAttack(e);
    }, {passive:false});
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', bindControls);
  }else{
    bindControls();
  }
})();
</script>


<style>
  #jumpBtn, #attackBtn {
    width: 92px !important;
    height: 92px !important;
    min-width: 92px !important;
    min-height: 92px !important;
    font-size: 18px !important;
    touch-action: none !important;
    z-index: 99999 !important;
  }
</style>
<script>
(function(){
  function flightPatch(){
    // Flight is intentionally cancelled by the jump button.
    const jb = document.getElementById('jumpBtn');
    if(!jb) return;
    const cancel = function(e){
      if(e){ e.preventDefault(); e.stopPropagation(); }
      try {
        if (typeof player !== 'undefined' && player && player.flight) {
          player.flight = false;
          player.flyTimer = 0;
          if ('vy' in player) player.vy = 0;
        }
        if (typeof game !== 'undefined' && game && game.player && game.player.flight) {
          game.player.flight = false;
          game.player.flyTimer = 0;
          if ('vy' in game.player) game.player.vy = 0;
        }
      } catch(err) {}
    };
    jb.addEventListener('pointerdown', cancel, {capture:true, passive:false});
    jb.addEventListener('touchstart', cancel, {capture:true, passive:false});
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', flightPatch);
  else flightPatch();
})();
</script>


<style>
  #jumpBtn, #attackBtn {
    width: 110px !important;
    height: 110px !important;
    min-width: 110px !important;
    min-height: 110px !important;
    font-size: 20px !important;
    touch-action: none !important;
    z-index: 99999 !important;
  }
</style>
<script>
(function(){
  function bindFlightCancel(){
    const jb = document.getElementById('jumpBtn');
    if(!jb) return;

    const cancelOrJump = function(e){
      if(e){ e.preventDefault(); e.stopPropagation(); }
      try {
        if (typeof player !== 'undefined' && player) {
          // IMPORTANT: the game stores remaining flight time in player.flight.
          if (player.flight > 0) {
            player.flight = 0;
            player.vy = 0;
            player.grounded = false;
            player.jumps = 0;
            return; // Do NOT perform a normal jump on the cancellation tap.
          }
          if (typeof jump === 'function') jump();
        }
      } catch(err) {}
    };

    // Pointer event handles modern Android Chrome/WebView.
    jb.addEventListener('pointerdown', cancelOrJump, {passive:false});
    // Touch fallback for devices/webviews that do not deliver pointer events.
    jb.addEventListener('touchstart', cancelOrJump, {passive:false});
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bindFlightCancel);
  else bindFlightCancel();
})();
</script>

let W=0,H=0,DPR=1,scale=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cvs.width=W*DPR;cvs.height=H*DPR;cvs.style.width=W+'px';cvs.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);scale=Math.max(.72,Math.min(1.25,H/760))}
addEventListener('resize',resize);resize();

const audio={ctx:null,master:null,bgmGain:null,started:false,step:0,timer:null};
function audioStart(){
 if(audio.started)return true;
 try{
   const AC=window.AudioContext||window.webkitAudioContext;
   if(!AC)return false;
   audio.ctx=new AC();
   audio.master=audio.ctx.createGain();
   audio.master.gain.value=.14;
   audio.master.connect(audio.ctx.destination);
   audio.bgmGain=audio.ctx.createGain();
   audio.bgmGain.gain.value=.28;
   audio.bgmGain.connect(audio.master);
   audio.started=true;
   startBGM();
   return true;
 }catch(e){
   // 音声機能が利用できない端末でもゲーム自体は開始する
   audio.ctx=null;
   audio.started=false;
   return false;
 }
}
function tone(freq,dur,type='sine',gain=.12,when=0){
 if(!audio.ctx)return;
 const o=audio.ctx.createOscillator(),g=audio.ctx.createGain();
 o.type=type;o.frequency.setValueAtTime(freq,audio.ctx.currentTime+when);
 g.gain.setValueAtTime(0.0001,audio.ctx.currentTime+when);
 g.gain.exponentialRampToValueAtTime(gain,audio.ctx.currentTime+when+.012);
 g.gain.exponentialRampToValueAtTime(0.0001,audio.ctx.currentTime+when+dur);
 o.connect(g);g.connect(audio.master);o.start(audio.ctx.currentTime+when);o.stop(audio.ctx.currentTime+when+dur+.03);
}
function sfx(kind){
 if(!audio.ctx)return;
 if(kind==='jump'){tone(520,.09,'square',.12);tone(760,.12,'square',.08,.05)}
 if(kind==='attack'){tone(240,.08,'sawtooth',.09);tone(520,.16,'triangle',.08,.06)}
 if(kind==='item'){tone(660,.08,'sine',.12);tone(880,.08,'sine',.12,.08);tone(1180,.15,'sine',.1,.16)}
 if(kind==='over'){tone(180,.18,'sawtooth',.14);tone(120,.35,'triangle',.12,.15)}
 if(kind==='hit'){tone(100,.12,'square',.13)}
}
function startBGM(){
 const notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];
 let i=0;
 audio.timer=setInterval(()=>{if(!audio.ctx)return;tone(notes[i%notes.length],.22,'triangle',.035);tone(notes[(i+2)%notes.length]/2,.28,'sine',.025,.02);i++},260);
}

let running=false,gameOver=false,last=0,world=0,distance=0;
let player,objects=[],iceballs=[],particles=[],spawnTimer=0,featherTimer=4;
const SPEED_MPS=5, PX_PER_M=72; // world movement; distance is still exactly 5 m/s
const GRAV=1850;

function reset(){
 // 二重起動を防ぎつつ、必ずゲーム状態を初期化
 running=false;
 gameOver=false;
 world=0;
 distance=0;
 objects=[];
 iceballs=[];
 particles=[];
 spawnTimer=1.3;
 featherTimer=3.8;
 const startX=Math.max(110,W*.27);
 player={x:startX,y:groundY(world+startX),vy:0,jumps:0,flight:0,attack:0,runT:0,grounded:true,inv:0};

 // 音声初期化は失敗してもゲーム開始を妨げない
 audioStart();
 try{ if(audio.ctx && audio.ctx.state==='suspended') audio.ctx.resume(); }catch(e){}

 overlay.classList.add('hidden');
 running=true;
 last=performance.now();
 // 最初のフレームを即時描画してからループ開始
 draw();
 requestAnimationFrame(loop);
}
function phaseInfo(){
 const p=Math.floor(distance/1000)%3;
 return p===0?['朝',0]:p===1?['昼',1]:['夜',2];
}
function groundY(wx){
 // local beach path with gentle slopes
 const seg=Math.floor(wx/500);
 const t=(wx%500)/500;
 const patterns=[0, .12, -.09, .06, -.14, .08];
 const a=patterns[seg%patterns.length], b=patterns[(seg+1)%patterns.length];
 return H*.77 + (a*(1-t)+b*t)*H*.16;
}
function inPit(wx){
 // deterministic pits, but no pit at the very beginning
 if(wx<950)return false;
 const n=Math.floor(wx/720);
 const start=n*720+380+(n%3)*55;
 return wx>start && wx<start+120+(n%2)*55;
}
function spawnObject(type,wx){
 objects.push({type,x:wx,y:groundY(wx)-20-H*0.02,hit:false,phase:Math.random()*6.28});
}
function spawnStuff(dt){
 spawnTimer-=dt; featherTimer-=dt;
 if(spawnTimer<=0){
   const wx=world+W/PX_PER_M+220+Math.random()*300;
   if(Math.random()<.48) spawnObject('enemy',wx);
   else spawnObject('enemy',wx);
   spawnTimer=1.35+Math.random()*1.3;
 }
 if(featherTimer<=0){
   const wx=world+W/PX_PER_M+300+Math.random()*500;
   spawnObject('feather',wx);
   const o=objects[objects.length-1];o.y=groundY(wx)-170-Math.random()*95;
   featherTimer=4.5+Math.random()*4;
 }
}
function jump(){
 if(!running||gameOver)return;
 if(player.flight>0)return;
 if(player.jumps<2){
   player.vy=-720;
   player.jumps++;
   player.grounded=false;
   sfx('jump');
   burst(player.x,player.y,'jump');
 }
}
function attack(){
 if(!running||gameOver)return;
 player.attack=.24;sfx('attack');
 iceballs.push({x:player.x+75,y:player.y-40,vx:720,life:1.2});
}
function burst(x,y,type){
 for(let i=0;i<12;i++)particles.push({x:x+Math.random()*30,y:y+Math.random()*20,vx:(Math.random()-.5)*160,vy:(Math.random()-.7)*180,life:.5+Math.random()*.4,type});
}
function playerRect(){return {x:player.x-34,y:player.y-115,w:70,h:112}}
function objectRect(o){
 if(o.type==='enemy')return {x:o.x-38,y:o.y-100,w:76,h:100};
 return {x:o.x-28,y:o.y-30,w:56,h:56};
}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function update(dt){
 if(!running)return;
 const meters=SPEED_MPS*dt; distance+=meters; world+=meters*PX_PER_M;
 player.x=Math.max(105,Math.min(W*0.34, W*0.30));
 const gy=groundY(world+player.x);
 if(player.flight>0){
   player.flight-=dt; player.y=gy-190+Math.sin(performance.now()/170)*22; player.vy=0; player.grounded=false;
 }else{
   player.vy+=GRAV*dt;player.y+=player.vy*dt;
   const floor=gy;
   if(!inPit(world+player.x) && player.y>=floor){player.y=floor;player.vy=0;player.grounded=true;player.jumps=0}
   else player.grounded=false;
   if(inPit(world+player.x) && player.y>H+80){endGame();return}
 }
 if(player.inv>0)player.inv-=dt;
 player.runT+=dt*9; if(player.attack>0)player.attack-=dt;
 spawnStuff(dt);

 for(const o of objects){
   o.x-=meters*PX_PER_M;
   if(o.type==='feather')o.y+=Math.sin(performance.now()/240+o.phase)*.4;
 }
 for(const b of iceballs){b.x+=b.vx*dt;b.life-=dt}
 iceballs=iceballs.filter(b=>b.life>0&&b.x<W+100);

 const pr=playerRect();
 for(const o of objects){
   if(o.hit)continue;
   if(o.type==='feather' && overlap(pr,objectRect(o))){
     o.hit=true;player.flight=3;sfx('item');burst(o.x,o.y,'item');
   }
   if(o.type==='enemy' && overlap(pr,objectRect(o)) && player.inv<=0){
     o.hit=true;player.inv=1;sfx('hit');endGame();return;
   }
 }
 for(const b of iceballs){
   for(const o of objects){
     if(o.hit||o.type!=='enemy')continue;
     const rr=objectRect(o);
     if(b.x>rr.x&&b.x<rr.x+rr.w&&b.y>rr.y&&b.y<rr.y+rr.h){
       o.hit=true;b.life=0;burst(o.x,o.y,'ice');sfx('item');
     }
   }
 }
 objects=objects.filter(o=>o.x>-120&&!o.hit);

 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.life-=dt}
 particles=particles.filter(p=>p.life>0);

 distEl.textContent=Math.floor(distance)+' m';
 const [ph,idx]=phaseInfo();phaseEl.textContent=ph;
}
function endGame(){
 if(gameOver)return;
 gameOver=true;running=false;sfx('over');
 titleEl.textContent='💥 ゲームオーバー';
 msgEl.innerHTML=`進んだ距離は <b style="font-size:1.5em">${Math.floor(distance)} m</b>！<br>もう一度、浜辺を走ろう！`;
 startBtn.textContent='もう一度プレイ';
 overlay.classList.remove('hidden');
}

function draw(){
 const [ph,idx]=phaseInfo();
 drawSky(idx);
 drawBeach();
 // objects
 for(const o of objects){
   if(o.type==='enemy')drawEnemy(o.x,o.y);
   else drawFeather(o.x,o.y);
 }
 for(const b of iceballs)drawIce(b.x,b.y);
 drawPlayer();
 for(const p of particles)drawParticle(p);
}
function drawSky(idx){
 let g=ctx.createLinearGradient(0,0,0,H);
 if(idx===0){g.addColorStop(0,'#78d9ff');g.addColorStop(1,'#eaf9ff')}
 if(idx===1){g.addColorStop(0,'#2f9fe9');g.addColorStop(1,'#ffe1a4')}
 if(idx===2){g.addColorStop(0,'#081a49');g.addColorStop(1,'#3b5a91')}
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // sea
 ctx.fillStyle=idx===2?'#163c70':'#38bde8';ctx.fillRect(0,H*.53,W,H*.25);
 for(let i=0;i<12;i++){const x=(i*170-(world*.22)%170);ctx.strokeStyle='#ffffff55';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,H*.61+(i%3)*20);ctx.quadraticCurveTo(x+45,H*.59+(i%3)*20,x+90,H*.61+(i%3)*20);ctx.stroke()}
 // sun/moon
 ctx.beginPath();ctx.arc(W*.82,H*.18,idx===2?38:46,0,Math.PI*2);ctx.fillStyle=idx===2?'#fff4c2':'#ffd34d';ctx.fill();
 if(idx===2){for(let i=0;i<35;i++){ctx.fillStyle='#ffffffaa';ctx.fillRect((i*97-world*.05)%W,H*.08+(i*43)%Math.max(1,H*.34),2,2)}}
 // distant islands
 ctx.fillStyle=idx===2?'#183b51':'#6fae6d';
 ctx.beginPath();ctx.moveTo(0,H*.55);for(let x=0;x<=W;x+=60)ctx.lineTo(x,H*.55-20-Math.sin((x+world*.05)/180)*18);ctx.lineTo(W,H*.65);ctx.lineTo(0,H*.65);ctx.fill();
}
function drawBeach(){
 const base=H*.77;
 // sand
 ctx.fillStyle=phaseInfo()[1]===2?'#8a795d':'#e8c47c';
 ctx.fillRect(0,base,W,H-base);
 // beach texture
 for(let i=0;i<30;i++){const x=(i*83-world*.35)%W;const y=base+25+(i*47)%Math.max(1,H-base-40);ctx.fillStyle='#ffffff35';ctx.fillRect(x,y,24,3)}
 // ground contour
 ctx.strokeStyle=phaseInfo()[1]===2?'#b9a176':'#fff2ba';ctx.lineWidth=8;ctx.beginPath();
 for(let x=0;x<=W;x+=8){const gy=groundY(world+x);if(x===0)ctx.moveTo(x,gy);else ctx.lineTo(x,gy)}
 ctx.stroke();
 // sand holes / gaps
 for(let x=0;x<W;x+=10){if(inPit(world+x)){ctx.fillStyle='#164064';ctx.fillRect(x,groundY(world+x)-4,10,H-groundY(world+x)+10)}}
 // palms
 for(let i=0;i<5;i++){const x=(i*260-world*.12)% (W+260)-80;const y=base-80-(i%2)*35;drawPalm(x,y)}
}
function drawPalm(x,y){
 ctx.strokeStyle='#7b542c';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(x,y+85);ctx.quadraticCurveTo(x+10,y+25,x+18,y-10);ctx.stroke();
 ctx.strokeStyle='#2d8a4b';ctx.lineWidth=7;
 for(let a=-1.1;a<=1.1;a+=.55){ctx.beginPath();ctx.moveTo(x+18,y-8);ctx.lineTo(x+18+Math.cos(a)*55,y-8+Math.sin(a)*38);ctx.stroke()}
}
function drawEnemy(x,y){
 ctx.save();ctx.translate(x,y);
 // cute beach crab monster
 ctx.fillStyle='#d84c3f';ctx.beginPath();ctx.ellipse(0,-42,38,27,0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#9f3029';ctx.lineWidth=6;
 for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*15,-22);ctx.lineTo(i*24,8+Math.abs(i)*3);ctx.stroke()}
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-14,-52,9,0,Math.PI*2);ctx.arc(14,-52,9,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-12,-51,4,0,Math.PI*2);ctx.arc(16,-51,4,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function drawFeather(x,y){
 ctx.save();ctx.translate(x,y);ctx.rotate(-.15);
 ctx.shadowColor='#fff';ctx.shadowBlur=18;ctx.fillStyle='#f5fbff';
 ctx.beginPath();ctx.moveTo(0,28);ctx.quadraticCurveTo(-50,4,-28,-35);ctx.quadraticCurveTo(4,-12,18,-48);ctx.quadraticCurveTo(50,-8,0,28);ctx.fill();
 ctx.strokeStyle='#86b6d9';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,25);ctx.lineTo(20,-34);ctx.stroke();
 ctx.restore();
}
function drawIce(x,y){
 ctx.save();ctx.translate(x,y);ctx.fillStyle='#8be9ff';ctx.strokeStyle='#2b89ad';ctx.lineWidth=3;
 ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.fillStyle='#ff8bd8';ctx.beginPath();ctx.arc(-4,-5,6,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function drawPlayer(){
 if(!player)return;

 let key;
 if(player.flight>0) key='fly'+(Math.floor(player.runT/1.5)%3+1);
 else if(player.attack>0) key='attack'+(Math.floor((.24-player.attack)*18)%4+1);
 else if(!player.grounded) key='jump'+Math.min(5,Math.max(1,player.jumps+2));
 else key='run'+(Math.floor(player.runT)%5+1);

 const im=imgs[key];
 const targetH=player.flight>0 ? Math.min(170,H*.22) : Math.min(165,H*.24);

 ctx.save();
 if(player.inv>0 && Math.floor(performance.now()/80)%2===0) ctx.globalAlpha=.45;

 // 画像の読み込みが間に合わない場合でも、キャラクター位置が分かる簡易表示を出す
 if(im && im.complete && im.naturalWidth>0 && im.naturalHeight>0){
   const ratio=im.naturalWidth/im.naturalHeight;
   const w=Math.max(50,targetH*ratio);
   ctx.drawImage(im,player.x-w*.5,player.y-targetH,w,targetH);
 }else{
   ctx.fillStyle='#f5f5f5';
   ctx.beginPath();
   ctx.arc(player.x,player.y-85,28,0,Math.PI*2);
   ctx.fill();
   ctx.fillStyle='#222';
   ctx.fillRect(player.x-24,player.y-58,48,55);
   ctx.font='900 13px sans-serif';
   ctx.fillStyle='#111';
   ctx.textAlign='center';
   ctx.fillText('kztk',player.x,player.y-80);
 }

 if(player.flight>0){
   ctx.font='900 18px sans-serif';
   ctx.fillStyle='#fff';
   ctx.textAlign='center';
   ctx.shadowColor='#000';
   ctx.shadowBlur=5;
   ctx.fillText('飛行 '+player.flight.toFixed(1)+'s',player.x,player.y-targetH-14);
 }
 ctx.restore();
}
function drawParticle(p){
 ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.type==='item'?'#fff5a8':p.type==='ice'?'#b9f3ff':'#ffffff';
 ctx.beginPath();ctx.arc(p.x,p.y,3+p.life*3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
}

function loop(t){
 const dt=Math.min(.033,Math.max(0,(t-last)/1000)); last=t;
 if(running) update(dt);
 draw();
 if(running) requestAnimationFrame(loop);
}
function press(el,fn){
 el.addEventListener('pointerdown',e=>{e.preventDefault();fn()},{passive:false});
}
press(jump,jump);press(attack,attack);
addEventListener('keydown',e=>{
 if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}
 if(e.code==='KeyX'||e.code==='KeyZ'){e.preventDefault();attack()}
});
function startGame(e){
 if(e){e.preventDefault();e.stopPropagation();}
 if(running)return;

 // 音声はユーザーがスタートを押した時だけ初期化。
 try{
   audioStart();
   if(audio.ctx && audio.ctx.state==='suspended') audio.ctx.resume();
 }catch(_){}

 try{
   running=true;
   gameOver=false;
   world=0;
   distance=0;
   objects=[];
   iceballs=[];
   particles=[];
   spawnTimer=1.3;
   featherTimer=3.8;

   const sx=Math.max(110,W*.27);
   player={
     x:sx,
     y:groundY(sx),
     vy:0,
     jumps:0,
     flight:0,
     attack:0,
     runT:0,
     grounded:true,
     inv:0
   };

   overlay.classList.add('hidden');
   last=performance.now();
   draw();
   requestAnimationFrame(loop);
 }catch(err){
   console.error(err);
   running=false;
   gameOver=false;
   overlay.classList.remove('hidden');
   titleEl.textContent='走れ！kztk';
   msgEl.innerHTML='スタートできませんでした。もう一度タップしてください。';
 }
}


// スタート画面表示中も背景を描画
requestAnimationFrame(()=>draw());
Object.values(imgs).forEach(im=>{
  im.addEventListener('load',()=>{ if(!running) draw(); },{once:false});
});

function forceStartGame(){
  try{
    if(running) return;

    // Sound is optional; never let audio initialization prevent game startup.
    try{
      audioStart();
      if(audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume();
    }catch(e){}

    running = true;
    gameOver = false;
    world = 0;
    distance = 0;
    objects = [];
    iceballs = [];
    particles = [];
    spawnTimer = 1.3;
    featherTimer = 3.8;

    const sx = Math.max(110, W * 0.27);
    player = {
      x:sx,
      y:groundY(sx),
      vy:0,
      jumps:0,
      flight:0,
      attack:0,
      runT:0,
      grounded:true,
      inv:0
    };

    overlay.classList.add('hidden');
    last = performance.now();
    draw();
    requestAnimationFrame(loop);
  }catch(err){
    console.error(err);
    running = false;
    gameOver = false;
    overlay.classList.remove('hidden');
    titleEl.textContent = '走れ！kztk';
    msgEl.innerHTML = '開始処理でエラーが発生しました。<br>もう一度「ゲームスタート」を押してください。';
  }
}

</script>
